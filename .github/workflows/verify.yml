name: Verify Lettercape
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mailcraft_migration
          POSTGRES_PASSWORD: mailcraft_local_migration
          POSTGRES_DB: mailcraft
        ports: ["55439:5432"]
        options: >-
          --health-cmd "pg_isready -U mailcraft_migration -d mailcraft"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      LOCAL_DEVELOPMENT: "true"
      APP_ORIGIN: http://127.0.0.1:3000
      DATABASE_URL: postgresql://mailcraft_runtime:mailcraft_local_runtime@127.0.0.1:55439/mailcraft
      MIGRATION_DATABASE_URL: postgresql://mailcraft_migration:mailcraft_local_migration@127.0.0.1:55439/mailcraft
      LOCAL_BOOTSTRAP_SECRET: ci-fixture-only-not-production-access
      PREFERENCE_SIGNING_SECRET: ci-fixture-only-preference-secret-32bytes
      AI_GENERATION_ALLOWANCE: "0"
      REDIS_URL: redis://127.0.0.1:56379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci
      - run: npm --prefix tooling/openapi ci
      - run: npm run api:check
      - run: npm run db:migrate
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Real local HTTP boundary checks
        run: |
          npm run smoke:webhook-configured
          npm run smoke:webhook-history-configured
          npm run dev > /tmp/lettercape-dev.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:3000/v1/health && break
            sleep 1
          done
          npm run smoke:api
          npm run smoke:navigation
          npm run smoke:editor
          npm run smoke:conversion
          npm run smoke:import
          npm run smoke:preferences
          npm run smoke:keys
          npm run smoke:contract
          npm run smoke:preflight
          npm run smoke:render-cache
          npm run smoke:derivation
          npm run smoke:dispatch-controls
          npm run smoke:events
          npm run smoke:webhooks
          npm run smoke:webhook-history
          npm run smoke:brand-memory
          npm run smoke:authority
          npm run smoke:memberships
          npm run smoke:creation
          npm run smoke:voice-guard
          npm run smoke:campaign-configuration
          npm run smoke:campaign-lifecycle
          npm run smoke:calendar
          npm run smoke:utm
          npm run smoke:audience-selection
          npm run smoke:sender-domain
      - name: Production release must remain closed
        run: |
          if node scripts/start-production.mjs; then
            echo "Unexpected production startup without release evidence"
            exit 1
          fi
  renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build dedicated renderer
        run: docker build -f renderer/Dockerfile -t lettercape-renderer:fixture .
      - name: Actual sandboxed renderer HTTP fixtures
        run: |
          mkdir -p /tmp/lettercape-renderer-evidence
          chmod 777 /tmp/lettercape-renderer-evidence
          docker run --rm --network none \
            --security-opt seccomp=renderer/seccomp-profile.json \
            --read-only --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --memory 1g --cpus 2 --pids-limit 256 \
            --mount type=bind,src="$PWD/scripts/smoke-renderer.mjs",dst=/fixture.mjs,readonly \
            --mount type=bind,src=/tmp/lettercape-renderer-evidence,dst=/evidence \
            --entrypoint node lettercape-renderer:fixture /fixture.mjs
      - name: Renderer production release must remain closed
        run: |
          if docker run --rm --network none lettercape-renderer:fixture; then
            echo "Unexpected renderer startup without release evidence"
            exit 1
          fi
